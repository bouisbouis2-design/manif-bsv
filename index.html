// CRUD Stock
function openNewStock() {
  editStId=null;
  document.getElementById('sh-stock-title').textContent='Nouvel article';
  ['st-name','st-unit'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('st-cat').value='boissons';
  ['st-br-qty','st-br-seuil','st-br-n1','st-sa-qty','st-sa-seuil','st-sa-n1'].forEach(id=>document.getElementById(id).value=0);
  document.getElementById('st-conso-wrap').style.display='';
  document.getElementById('st-matos-wrap').style.display='none';
  document.getElementById('st-cat').onchange=updateStockForm;
  openSh('sh-stock');
}
function openEditStock(id) {
  const s=stocks[id]; if(!s)return; editStId=id;
  document.getElementById('sh-stock-title').textContent='Modifier l\'article';
  document.getElementById('st-name').value=s.nom||'';
  document.getElementById('st-unit').value=s.unite||'';
  document.getElementById('st-cat').value=s.categorie||'boissons';
  const isMat=s.type==='materiel';
  document.getElementById('st-conso-wrap').style.display=isMat?'none':'';
  document.getElementById('st-matos-wrap').style.display=isMat?'':'none';
  if(!isMat){
    document.getElementById('st-br-qty').value=s.bransat?.quantite||0;
    document.getElementById('st-br-seuil').value=s.bransat?.seuilAlerte||0;
    document.getElementById('st-br-n1').value=s.bransat?.consoN1||0;
    document.getElementById('st-sa-qty').value=s.saulcet?.quantite||0;
    document.getElementById('st-sa-seuil').value=s.saulcet?.seuilAlerte||0;
    document.getElementById('st-sa-n1').value=s.saulcet?.consoN1||0;
  } else {
    document.getElementById('st-br-mat-qty').value=s.bransat?.quantite||0;
    document.getElementById('st-br-etat').value=s.bransat?.etat||'bon';
    document.getElementById('st-sa-mat-qty').value=s.saulcet?.quantite||0;
    document.getElementById('st-sa-etat').value=s.saulcet?.etat||'bon';
  }
  document.getElementById('st-cat').onchange=updateStockForm;
  openSh('sh-stock');
}
function updateStockForm() {
  const isMat=document.getElementById('st-cat').value==='materiel';
  document.getElementById('st-conso-wrap').style.display=isMat?'none':'';
  document.getElementById('st-matos-wrap').style.display=isMat?'':'none';
}
async function saveStock() {
  const nom=document.getElementById('st-name').value.trim();
  if(!nom){toast('Nom obligatoire');return;}
  const btn=document.getElementById('st-save-btn');
  btn.disabled=true; btn.innerHTML='<i class="ti ti-loader-2"></i>…';
  try {
    const cat=document.getElementById('st-cat').value;
    const isMat=cat==='materiel';
    const data={nom,categorie:cat,unite:document.getElementById('st-unit').value.trim(),type:isMat?'materiel':'consommable'};
    if(!isMat){
      data.bransat={quantite:parseInt(document.getElementById('st-br-qty').value)||0,seuilAlerte:parseInt(document.getElementById('st-br-seuil').value)||0,consoN1:parseInt(document.getElementById('st-br-n1').value)||0};
      data.saulcet={quantite:parseInt(document.getElementById('st-sa-qty').value)||0,seuilAlerte:parseInt(document.getElementById('st-sa-seuil').value)||0,consoN1:parseInt(document.getElementById('st-sa-n1').value)||0};
    } else {
      data.bransat={quantite:parseInt(document.getElementById('st-br-mat-qty').value)||0,etat:document.getElementById('st-br-etat').value};
      data.saulcet={quantite:parseInt(document.getElementById('st-sa-mat-qty').value)||0,etat:document.getElementById('st-sa-etat').value};
    }
    const id=editStId||'st_'+Date.now();
    await DB.set(`stocks/${id}`,{...((editStId?stocks[editStId]:{})),id,...data});
    toast(editStId?'Article modifié':'Article ajouté'); closeSh('sh-stock');
  }catch(e){toast('Erreur : '+e.message);}
  finally{btn.disabled=false;btn.innerHTML='<i class="ti ti-check"></i> Enregistrer';}
}

// Mouvement
function openMvt(stId, local) {
  mvtStId=stId; mvtQty=1;
  const s=stocks[stId];
  document.getElementById('sh-mvt-title').textContent=`Mouvement — ${s?esc(s.nom):'?'}`;
  document.getElementById('mvt-local').value=local;
  document.getElementById('mvt-type').value='sortie';
  document.getElementById('mvt-qty-val').textContent='1';
  document.getElementById('mvt-comment').value='';
  openSh('sh-mvt');
}
function qtyChange(d){mvtQty=Math.max(1,mvtQty+d);document.getElementById('mvt-qty-val').textContent=mvtQty;}
async function saveMvt() {
  if(!mvtStId){toast('Erreur');return;}
  const btn=document.getElementById('mvt-save-btn');
  btn.disabled=true;
  try {
    const local=document.getElementById('mvt-local').value;
    const type=document.getElementById('mvt-type').value;
    const s=stocks[mvtStId];
    if(!s){toast('Article introuvable');return;}
    // Mettre à jour la quantité
    const localData=s[local]||{};
    const newQty=(localData.quantite||0)+(type==='entree'?mvtQty:-mvtQty);
    await DB.update(`stocks/${mvtStId}`,{[local]:{...localData,quantite:Math.max(0,newQty)}});
    // Enregistrer le mouvement
    await DB.set(`mouvements/mvt_${Date.now()}`,{stockId:mvtStId,local,type,quantite:mvtQty,membre:curUser?.prenom||'?',comment:document.getElementById('mvt-comment').value.trim(),date:Date.now(),evenementId:curEvId||null});
    toast(type==='sortie'?'Sortie enregistrée':'Entrée enregistrée');
    closeSh('sh-mvt');
  }catch(e){toast('Erreur : '+e.message);}
  finally{btn.disabled=false;}
}

// Besoins événement
function showBesoins(stId) {
  if(!curEvId){toast('Sélectionnez un événement');return;}
  const s=stocks[stId],m=manifests[curEvId];
  if(!s||!m){return;}
  const nbPart=m.nbParticipants||50;
  const calcBesoin=(local)=>{
    const d=s[local]; if(!d)return null;
    const n1=d.consoN1||0;
    const nbN1=m.nbParticipantsN1||nbPart; // approximation
    const besoin=n1>0?Math.ceil(n1*(nbPart/nbN1)):0;
    const manque=Math.max(0,besoin-(d.quantite||0));
    return {besoin,actuel:d.quantite||0,manque};
  };
  const br=calcBesoin('bransat'),sa=calcBesoin('saulcet');
  document.getElementById('sh-besoins-title').textContent=`${esc(s.nom)} — ${esc(m.name)}`;
  document.getElementById('besoins-content').innerHTML=`
    <div style="background:var(--g0);border-radius:10px;padding:12px;font-size:13px;color:var(--muted);line-height:1.6">
      Calcul basé sur <strong>${nbPart} participants</strong> prévus et la conso N-1.
    </div>
    ${br?`<div class="card-sm">
      <div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:8px">BRANSAT</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>Stock actuel</span><strong>${br.actuel} ${s.unite||''}</strong></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>Besoin estimé</span><strong>${br.besoin} ${s.unite||''}</strong></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:${br.manque>0?'#c53030':'#2e7d32'}"><span>À commander</span><span>${br.manque>0?`+${br.manque}`:'✓ OK'} ${s.unite||''}</span></div>
    </div>`:''}
    ${sa?`<div class="card-sm">
      <div style="font-size:12px;font-weight:700;color:var(--violet);margin-bottom:8px">SAULCET</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>Stock actuel</span><strong>${sa.actuel} ${s.unite||''}</strong></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>Besoin estimé</span><strong>${sa.besoin} ${s.unite||''}</strong></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:${sa.manque>0?'#c53030':'#2e7d32'}"><span>À commander</span><span>${sa.manque>0?`+${sa.manque}`:'✓ OK'} ${s.unite||''}</span></div>
    </div>`:''}
  `;
  openSh('sh-besoins');
}

// ═══════════════════════════ MEMBRES ══════════════════════════
function updateBadgeMembres() {
  const attente=Object.values(membres).filter(m=>m.role==='attente').length;
  const badge=document.getElementById('badge-membres');
  badge.style.display=attente&&curUser?.role==='admin'?'':'none';
  badge.textContent=attente;
}

function renderMembres() {
  const el=document.getElementById('membres-content');
  const isAdmin=curUser?.role==='admin';
  const all=Object.values(membres);
  if(!all.length){
    el.innerHTML=`<div class="empty"><i class="ti ti-users"></i><h3>Aucun membre</h3><p>Les membres apparaîtront ici après leur inscription.</p></div>`;
    return;
  }
  const roleOrder={admin:0,organisateur:1,membre:2,attente:3};
  all.sort((a,b)=>(roleOrder[a.role]??9)-(roleOrder[b.role]??9)||(a.prenom||'').localeCompare(b.prenom||''));
  const roleLabels={admin:'Admin',organisateur:'Organisateur',membre:'Membre',attente:'En attente'};
  const roleBadge={admin:'badge-red',organisateur:'badge-blue',membre:'badge-green',attente:'badge-amber'};
  el.innerHTML=`
    ${isAdmin?`<div style="display:flex;align-items:center;justify-content:space-between"><span class="slabel">Membres (${all.length})</span></div>`:'<div class="slabel">Membres</div>'}
    ${all.map(m=>`<div class="membre-card">
      <div class="membre-avatar">${(m.prenom||'?')[0].toUpperCase()}</div>
      <div class="membre-info">
        <div class="membre-name">${esc(m.prenom||'?')} ${m.id===curUser?.id?'<span style="font-size:11px;color:var(--g4)">(moi)</span>':''}</div>
        <div class="membre-phone">${m.telephone||'Pas de téléphone'}</div>
      </div>
      <span class="badge ${roleBadge[m.role]||'badge-gray'}">${roleLabels[m.role]||m.role}</span>
      ${isAdmin&&m.role!=='admin'?`<div class="membre-actions">
        ${m.role==='attente'?`<button class="btn-icon btn-xs btn-success" onclick="validerMembre('${m.id}')" title="Valider"><i class="ti ti-check"></i></button>`:''}
        <button class="btn-icon btn-xs" onclick="changerRole('${m.id}')" title="Changer rôle"><i class="ti ti-edit"></i></button>
        <button class="btn-icon btn-xs btn-danger" onclick="supprimerMembre('${m.id}')" title="Supprimer"><i class="ti ti-trash"></i></button>
      </div>`:''}
    </div>`).join('')}
  `;
}

async function validerMembre(id) {
  await DB.update(`membres/${id}`,{role:'membre',statut:'valide'});
  toast('Membre validé');
}
async function changerRole(id) {
  const m=membres[id]; if(!m)return;
  const roles=['membre','organisateur','attente'];
  const next=roles[(roles.indexOf(m.role)+1)%roles.length];
  await DB.update(`membres/${id}`,{role:next});
  toast(`Rôle : ${next}`);
}
async function supprimerMembre(id) {
  document.getElementById('del-desc').textContent=`Supprimer le membre "${membres[id]?.prenom}" ?`;
  delCb=async()=>{await DB.delete(`membres/${id}`);toast('Membre supprimé');};
  openSh('sh-del');
}
function openAddMembre() { openSh('sh-profil'); } // Réutilise la sheet profil

// ═══════════════════════════ SUPPRESSION GÉNÉRIQUE ════════════
document.getElementById('del-ok-btn').onclick=async()=>{
  if(delCb){await delCb();delCb=null;}closeSh('sh-del');
};
