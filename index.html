<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:#fff;--g0:#f9f8f6;--g1:#f2f0ed;--g2:#e6e3de;--g3:#ccc9c2;
  --g4:#9e9b93;--g5:#6b6860;--g6:#3a3834;--g7:#1c1a17;
  --text:#1c1a17;--muted:#6b6860;--border:#e6e3de;
  --nav-h:60px;--top-h:56px;--r:12px;
  --ac:#2e7d32;--ac-bg:#e8f5e9;--ac-mid:#81c784;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--g0)}
body{display:flex;flex-direction:column}

/* ── PAGE CONNEXION ── */
#page-login{position:fixed;inset:0;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 24px;z-index:999;transition:opacity .3s}
#page-login.out{opacity:0;pointer-events:none}
#page-login img{width:110px;height:110px;object-fit:contain}
#page-login h1{font-size:20px;font-weight:700;text-align:center;color:var(--text)}
#page-login p{font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
.login-form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
.login-form input{border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;font-size:15px;font-family:inherit;color:var(--text);background:var(--white);outline:none;width:100%;transition:border-color .15s}
.login-form input:focus{border-color:var(--ac)}
.login-form button{background:var(--ac);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .15s}
.login-form button:active{opacity:.85}
.login-form button:disabled{opacity:.5;cursor:not-allowed}
#login-status{font-size:13px;padding:10px 14px;border-radius:10px;display:none;text-align:center;line-height:1.5}
#login-status.attente{background:var(--amber-bg,#fef3e2);color:#a0620e}
#login-status.erreur{background:#fde8e8;color:#c53030}

/* ── APP ── */
#page-app{flex:1;display:none;flex-direction:column;overflow:hidden}
#page-app.on{display:flex}

/* TOPBAR */
#topbar{height:var(--top-h);background:var(--white);border-bottom:1.5px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.topbar-logo{height:36px;width:36px;object-fit:contain;flex-shrink:0}
.topbar-name{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip{display:flex;align-items:center;gap:6px;background:var(--g0);border:1.5px solid var(--border);border-radius:20px;padding:5px 12px 5px 8px;cursor:pointer}
.user-chip i{font-size:16px;color:var(--g4)}
.user-chip span{font-size:12px;font-weight:600;color:var(--text)}
.role-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.role-tag.admin{background:#fdeee9;color:#c04a25}
.role-tag.orga{background:#e4f5ef;color:#1a7d62}
.role-tag.membre{background:var(--g1);color:var(--g5)}
#sync{width:7px;height:7px;border-radius:50%;background:#f5c46a;flex-shrink:0;transition:background .3s}
#sync.ok{background:#6ec97a}

/* APP BODY */
#app{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;background:var(--g0)}
.screen.active{display:block}
.screen-flex{position:absolute;inset:0;display:none;flex-direction:column;background:var(--g0)}
.screen-flex.active{display:flex}

/* NAV */
#nav{height:var(--nav-h);background:var(--white);border-top:1.5px solid var(--border);display:flex;flex-shrink:0}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;font-family:inherit;color:var(--g4);font-size:10px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .15s;position:relative}
.nitem i{font-size:22px}
.nitem.active{color:var(--ac)}
.nbadge{background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;position:absolute;top:6px;right:calc(50% - 18px)}

/* FAB */
#fab{position:fixed;bottom:calc(var(--nav-h)+16px);right:16px;width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 20px rgba(46,125,50,.4);z-index:100;-webkit-tap-highlight-color:transparent;transition:transform .15s;opacity:0;pointer-events:none}
#fab:active{transform:scale(.92)}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav-h)+16px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--g7);color:#fff;font-size:13px;font-weight:500;padding:10px 20px;border-radius:20px;z-index:200;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* SHEETS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:150;display:none;align-items:flex-end}
.overlay.on{display:flex}
.sheet{width:100%;background:var(--white);border-radius:20px 20px 0 0;padding:16px 20px 40px;display:flex;flex-direction:column;gap:13px;max-height:92vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh-handle{width:36px;height:4px;background:var(--g2);border-radius:3px;margin:0 auto 4px;flex-shrink:0}
.sh-title{font-size:17px;font-weight:700}

/* FORMS */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--g5);letter-spacing:.02em}
.field input,.field select,.field textarea{border:1.5px solid var(--border);border-radius:10px;background:var(--white);color:var(--text);font-family:inherit;font-size:15px;padding:12px 13px;outline:none;width:100%;transition:border-color .15s;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ac)}
.field textarea{resize:none;min-height:80px;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 18px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:1.5px solid transparent;font-family:inherit;transition:opacity .12s;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{opacity:.8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--ac);color:#fff}
.btn-ghost{background:var(--g0);color:var(--g6);border-color:var(--border)}
.btn-danger{background:#fde8e8;color:#c53030;border-color:#f5c6c6}
.btn-success{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7}
.btn-warn{background:#fef3e2;color:#a0620e;border-color:#f5c46a}
.btn-block{width:100%}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn-xs{padding:5px 10px;font-size:11px;border-radius:7px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:9px;border:1.5px solid var(--border);background:var(--g0);color:var(--g5);display:inline-flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0}

/* CARDS */
.card{background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:14px}
.card-sm{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px}

/* MISC */
.slabel{font-size:11px;font-weight:700;color:var(--g4);letter-spacing:.06em;text-transform:uppercase}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty i{font-size:40px;color:var(--g2)}
.empty h3{font-size:15px;font-weight:600;color:var(--g5)}
.empty p{font-size:13px;color:var(--g4);line-height:1.5}
.prog-track{height:7px;background:var(--g1);border-radius:5px;overflow:hidden}
.prog-fill{height:7px;border-radius:5px;background:var(--ac);transition:width .4s}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.badge-red{background:#fde8e8;color:#c53030}
.badge-green{background:#e8f5e9;color:#2e7d32}
.badge-amber{background:#fef3e2;color:#a0620e}
.badge-blue{background:#e8f2fd;color:#2070c0}
.badge-gray{background:var(--g1);color:var(--g5)}
.cpicker{display:flex;gap:10px;flex-wrap:wrap}
.copt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s}
.copt.on{border-color:var(--g7);transform:scale(1.15)}

/* COULEURS ÉVÉNEMENTS */
:root{
  --violet:#5b52c4;--violet-bg:#f0effe;--violet-mid:#c5bff5;
  --teal:#1a7d62;--teal-bg:#e4f5ef;--teal-mid:#7fd4b8;
  --coral:#c04a25;--coral-bg:#fdeee9;--coral-mid:#f4a58a;
  --amber:#a0620e;--amber-bg:#fef3e2;--amber-mid:#f5c46a;
  --pink:#b03468;--pink-bg:#fdeaf2;--pink-mid:#f0a3c4;
  --blue:#2070c0;--blue-bg:#e8f2fd;--blue-mid:#90c0f0;
  --sage:#3a7d28;--sage-bg:#eef5ea;--sage-mid:#9ecf8a;
  --mauve:#7a3aac;--mauve-bg:#f4eef8;--mauve-mid:#c89de0;
}

/* DASHBOARD */
.dash-ev-card{background:var(--white);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer}
.dash-ev-banner{height:6px}
.dash-ev-body{padding:14px}
.dash-ev-name{font-size:16px;font-weight:700;margin-bottom:4px}
.dash-alert{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.dash-alert-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ÉVÉNEMENTS */
.ev-card{background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.ev-strip{width:5px;height:46px;border-radius:4px;flex-shrink:0}
.ev-info{flex:1;min-width:0}
.ev-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cd-pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px}

/* DÉTAIL ÉVÉNEMENT */
.det-header{background:var(--white);border-bottom:1.5px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.back-btn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--border);background:var(--white);color:var(--g5);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.det-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.det-sub{font-size:11px;color:var(--muted);margin-top:1px}
.itabs{background:var(--white);border-bottom:1.5px solid var(--border);display:flex;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.itabs::-webkit-scrollbar{display:none}
.itab{flex-shrink:0;padding:11px 14px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;transition:color .12s}
.itab.on{color:var(--ac);border-bottom-color:var(--ac)}
.action-bar{background:var(--white);border-bottom:1.5px solid var(--border);padding:10px 14px;display:flex;gap:8px;flex-shrink:0}
.det-body{flex:1;overflow-y:auto}
.ipanel{display:none;padding:14px;flex-direction:column;gap:10px}
.ipanel.on{display:flex}

/* TÂCHES */
.tcard{background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px;cursor:pointer}
.tcard.mine{border-left:4px solid var(--ac)}
.tcard.full-card{opacity:.65}
.tc-name{font-size:14px;font-weight:600;line-height:1.4;flex:1}
.ppill{font-size:10px;font-weight:700;padding:2px 9px;border-radius:8px;flex-shrink:0}
.ppill.haute{background:#fde8e8;color:#c53030}
.ppill.moyenne{background:#fef3cd;color:#a05c00}
.ppill.basse{background:#e8f5e9;color:#2e7d32}
.schip{font-size:11px;padding:3px 10px;border-radius:8px;background:var(--g0);border:1.5px solid var(--border);color:var(--g4);font-weight:500}
.schip.filled{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32}
.schip.mine-s{background:var(--ac-bg);border-color:var(--ac-mid);color:var(--ac)}
.prog-sm{height:4px;background:var(--g1);border-radius:3px;overflow:hidden}
.prog-sm-fill{height:4px;border-radius:3px;background:var(--ac)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbox{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center}
.snum{font-size:24px;font-weight:700;color:var(--ac)}
.slbl-sm{font-size:10px;color:var(--muted);margin-top:2px;font-weight:500}

/* CALENDRIER */
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-nav h2{flex:1;text-align:center;font-size:15px;font-weight:700}
.cal-navbtn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);color:var(--g5);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.cdh{background:var(--g0);padding:7px 2px;text-align:center;font-size:10px;font-weight:700;color:var(--g4)}
.cday{background:var(--white);min-height:62px;padding:5px 4px;display:flex;flex-direction:column;gap:2px}
.cday.other .cnum{color:var(--g3)}
.cday.today{background:#f0fdf4}
.cnum{font-size:11px;font-weight:500;color:var(--g5)}
.cchip{font-size:9px;padding:2px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;line-height:1.3}

/* PLANNING */
.rweek{background:var(--white);border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.rweek-h{padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--g5);background:var(--g0);border-bottom:1px solid var(--border);letter-spacing:.03em}
.rweek-h.ev{background:var(--ac-bg);color:var(--ac)}
.rweek-body{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.rchip{font-size:12px;padding:8px 10px;border-radius:9px;background:var(--g0);border:1.5px solid var(--border);display:flex;align-items:center;gap:7px;cursor:pointer}
.rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* STOCKS */
.stock-tabs{background:var(--white);border-bottom:1.5px solid var(--border);display:flex;flex-shrink:0}
.stab{flex:1;padding:12px 8px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;text-align:center;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.stab.on{color:var(--ac);border-bottom-color:var(--ac)}
.stock-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.stock-card{background:var(--white);border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.stock-card-header{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--g0)}
.stock-card-name{font-size:14px;font-weight:600;flex:1}
.stock-card-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.local-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.local-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;background:#e8f2fd;color:#2070c0;flex-shrink:0}
.local-tag.saulcet{background:#f0effe;color:#5b52c4}
.local-qty{font-size:15px;font-weight:700;flex:1}
.local-alert{font-size:11px;color:#c53030;font-weight:500}
.mat-etat{font-size:11px;font-weight:600;padding:2px 9px;border-radius:8px}
.mat-etat.bon{background:#e8f5e9;color:#2e7d32}
.mat-etat.moyen{background:#fef3e2;color:#a0620e}
.mat-etat.mauvais{background:#fde8e8;color:#c53030}
.qty-input{display:flex;align-items:center;gap:10px;margin-top:4px}
.qty-btn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--g0);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
.qty-val{font-size:22px;font-weight:700;min-width:50px;text-align:center}

/* MEMBRES */
.membre-card{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
.membre-avatar{width:42px;height:42px;border-radius:50%;background:var(--ac-bg);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--ac);flex-shrink:0}
.membre-info{flex:1;min-width:0}
.membre-name{font-size:14px;font-weight:600}
.membre-phone{font-size:12px;color:var(--muted);margin-top:2px}

/* CHECKLIST EDITOR */
.cl-edit-row{display:flex;align-items:center;gap:8px}
.cl-edit-row input{flex:1;font-size:14px;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;font-family:inherit;color:var(--text);background:var(--white);outline:none}
.cl-del{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);background:var(--g0);color:var(--g4);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--g2);border-radius:3px}
</style>
</head>
<body>

<!-- ════ PAGE CONNEXION ════ -->
<div id="page-login">
  <img id="login-logo" src="" alt="BSV">
  <div>
    <h1>Amicale Laïque BSV</h1>
    <p style="margin-top:6px">Entrez votre prénom et téléphone<br>pour accéder à l'app.</p>
  </div>
  <div class="login-form">
    <input id="inp-prenom" type="text" placeholder="Prénom" maxlength="30" autocomplete="off">
    <input id="inp-tel" type="tel" placeholder="Téléphone" maxlength="20" inputmode="tel">
    <div id="login-status"></div>
    <button id="login-btn" onclick="connexion()"><i class="ti ti-login"></i> Accéder</button>
  </div>
</div>

<!-- ════ PAGE APP ════ -->
<div id="page-app">

  <!-- TOPBAR -->
  <div id="topbar">
    <img class="topbar-logo" id="topbar-logo" src="" alt="BSV">
    <span class="topbar-name">Amicale Laïque BSV</span>
    <div class="user-chip" onclick="deconnect()">
      <i class="ti ti-user-circle"></i>
      <span id="user-nom">?</span>
    </div>
    <span class="role-tag" id="role-tag"></span>
    <div id="sync"></div>
  </div>

  <!-- APP CONTENT -->
  <div id="app">

    <!-- DASHBOARD -->
    <div class="screen active" id="screen-dash">
      <div id="dash-content" style="padding:14px;display:flex;flex-direction:column;gap:14px"></div>
    </div>

    <!-- ÉVÉNEMENTS -->
    <div class="screen" id="screen-events">
      <div id="ev-list" style="padding:14px;display:flex;flex-direction:column;gap:10px"></div>
    </div>

    <!-- DÉTAIL ÉVÉNEMENT -->
    <div class="screen-flex" id="screen-detail">
      <div class="det-header">
        <button class="back-btn" onclick="goTo('events')"><i class="ti ti-arrow-left"></i></button>
        <div style="flex:1;min-width:0;cursor:pointer" onclick="openManifPicker()">
          <div style="display:flex;align-items:center;gap:4px">
            <div class="det-name" id="det-name"></div>
            <i class="ti ti-chevron-down" style="font-size:13px;color:var(--g4);flex-shrink:0"></i>
          </div>
          <div class="det-sub" id="det-sub"></div>
        </div>
        <div id="det-btns" style="display:flex;gap:6px"></div>
      </div>
      <div class="action-bar" id="det-action-bar" style="display:none">
        <button class="btn btn-primary btn-sm" style="flex:1" onclick="openNewTask()"><i class="ti ti-plus"></i> Nouvelle tâche</button>
      </div>
      <div class="itabs" id="itabs">
        <button class="itab on" data-t="tasks"><i class="ti ti-list-check"></i> Tâches</button>
        <button class="itab" data-t="cal"><i class="ti ti-calendar-month"></i> Calendrier</button>
        <button class="itab" data-t="retro"><i class="ti ti-clock-hour-4"></i> Planning</button>
        <button class="itab" data-t="admin" id="itab-admin" style="display:none"><i class="ti ti-settings"></i> Admin</button>
      </div>
      <div class="det-body">
        <div class="ipanel on" id="ip-tasks"></div>
        <div class="ipanel" id="ip-cal">
          <div class="cal-nav">
            <button class="cal-navbtn" onclick="calPrev()"><i class="ti ti-chevron-left"></i></button>
            <h2 id="cal-label"></h2>
            <button class="cal-navbtn" onclick="calNext()"><i class="ti ti-chevron-right"></i></button>
          </div>
          <div class="cgrid" id="cgrid"></div>
        </div>
        <div class="ipanel" id="ip-retro"></div>
        <div class="ipanel" id="ip-admin">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span class="slabel">Tâches</span>
            <button class="btn btn-primary btn-xs" onclick="openNewTask()"><i class="ti ti-plus"></i> Nouvelle</button>
          </div>
          <div id="admin-task-list"></div>
        </div>
      </div>
    </div>

    <!-- STOCKS -->
    <div class="screen-flex" id="screen-stocks">
      <div class="stock-tabs">
        <button class="stab on" data-st="conso" onclick="switchStab('conso')">Consommables</button>
        <button class="stab" data-st="matos" onclick="switchStab('matos')">Matériel</button>
        <button class="stab" data-st="mvt" onclick="switchStab('mvt')">Mouvements</button>
      </div>
      <div class="stock-body" id="stock-body"></div>
    </div>

    <!-- MEMBRES -->
    <div class="screen" id="screen-membres">
      <div id="membres-content" style="padding:14px;display:flex;flex-direction:column;gap:10px"></div>
    </div>

  </div>

  <!-- NAV -->
  <div id="nav">
    <button class="nitem active" data-s="dash" onclick="goTo('dash')">
      <i class="ti ti-layout-dashboard"></i>Accueil
    </button>
    <button class="nitem" data-s="events" onclick="goTo('events')">
      <i class="ti ti-calendar-event"></i>Événements
    </button>
    <button class="nitem" data-s="stocks" onclick="goTo('stocks')">
      <i class="ti ti-package"></i>Stocks
    </button>
    <button class="nitem" data-s="membres" onclick="goTo('membres')" style="position:relative">
      <i class="ti ti-users"></i>Membres
      <span class="nbadge" id="badge-membres" style="display:none">0</span>
    </button>
  </div>

</div>

<!-- FAB -->
<button id="fab" onclick="onFab()"><i class="ti ti-plus"></i></button>
<div id="toast"></div>

<!-- ════ SHEETS ════ -->

<!-- Sélecteur manif -->
<div class="overlay" id="sh-manif-pick" onclick="closeSh('sh-manif-pick')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sh-handle"></div>
    <div class="sh-title">Changer d'événement</div>
    <div id="manif-pick-list" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="btn btn-ghost btn-block" onclick="closeSh('sh-manif-pick')">Annuler</button>
  </div>
</div>

<!-- Événement -->
<div class="overlay" id="sh-event" onclick="closeSh('sh-event')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sh-handle"></div>
    <div class="sh-title" id="sh-event-title">Nouvel événement</div>
    <div class="field"><label>Nom</label><input id="ev-name" type="text" placeholder="ex : Halloween 2026"></div>
    <div class="field"><label>Date</label><input id="ev-date" type="date"></div>
    <div class="field-row">
      <div class="field"><label>Participants prévus</label><input id="ev-nb" type="number" min="1" value="50" inputmode="numeric"></div>
      <div class="field"><label>Participants N-1</label><input id="ev-nb-n1" type="number" min="0" value="0" inputmode="numeric"></div>
    </div>
    <div class="field"><label>Couleur</label><div class="cpicker" id="cpicker"></div></div>
    <button class="btn btn-primary btn-block" id="ev-save-btn" onclick="saveEvent()"><i class="ti ti-check"></i> Enregistrer</button>
    <button class="btn btn-ghost btn-block" onclick="closeSh('sh-event')">Annuler</button>
  </div>
</div>

<!-- Tâche -->
<div class="overlay" id="sh-task" onclick="closeSh('sh-task')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sh-handle"></div>
    <div class="sh-title" id="sh-task-title">Nouvelle tâche</div>
    <div class="field"><label>Titre</label><input id="tk-name" type="text" placeholder="ex : Décoration salle"></div>
    <div class="field"><label>Description</label><textarea id="tk-desc" placeholder="Détails, consignes…" rows="3"></textarea></div>
    <div class="field-row">
      <div class="field"><label>Priorité</label>
        <select id="tk-prio"><option value="haute">Haute</option><option value="moyenne" selected>Moyenne</option><option value="basse">Basse</option></select>
      </div>
      <div class="field"><label>Personnes</label><input id="tk-spots" type="number" min="1" max="20" value="1" inputmode="numeric"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Début</label><input id="tk-start" type="date"></div>
      <div class="field"><label>Deadline</label><input id="tk-dead" type="date"></div>
    </div>
    <div class="field">
      <label>Checklist</label>
      <div id="cl-editor" style="display:flex;flex-direction:column;gap:7px"></div>
      <button class="btn btn-ghost btn-sm" onclick="addCL()" style="margin-top:6px;align-self:flex-start"><i class="ti ti-plus"></i> Ajouter</button>
    </div>
    <button class="btn btn-primary btn-block" id="tk-save-btn" onclick="saveTask()"><i class="ti ti-check"></i> Enregistrer</button>
    <button class="btn btn-ghost btn-block" onclick="closeSh('sh-task')">Annuler</button>
  </div>
</div>

<!-- Détail tâche -->
<div class="overlay" id="sh-tdet" onclick="closeSh('sh-tdet')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sh-handle"></div>
    <div style="display:flex;align-items:flex-start;gap:8px">
      <div class="sh-title" id="tdet-name" style="flex:1;font-size:16px"></div>
      <span class="ppill" id="tdet-prio"></span>
    </div>
    <div id="tdet-meta" style="font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-weight:500"></div>
    <p id="tdet-desc" style="font-size:13px;color:var(--muted);line-height:1.6;display:none"></p>
    <div id="tdet-spots"></div>
    <div id="tdet-cl"></div>
    <div id="tdet-actions" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="btn btn-ghost btn-block" onclick="closeSh('sh-tdet')">Fermer</button>
  </div>
</div>

<!-- Article stock -->
<div class="overlay" id="sh-stock" onclick="closeSh('sh-stock')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sh-handle"></div>
    <div class="sh-title" id="sh-stock-title">Nouvel article</div>
    <div class="field"><label>Nom</label><input id="st-name" type="text" placeholder="ex : Bière 33cl"></div>
    <div class="field-row">
      <div class="field"><label>Catégorie</label>
        <select id="st-cat" onchange="updateStockForm()">
          <option value="boissons">Boissons</option>
          <option value="nourriture">Nourriture</option>
          <option value="packaging">Packaging</option>
          <option value="materiel">Matériel</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="field"><label>Unité</label><input id="st-unit" type="text" placeholder="carton, pièce…"></div>
    </div>
    <div id="st-conso-wrap">
      <div class="slabel" style="margin-bottom:8px">BRANSAT</div>
      <div class="field-row">
        <div class="field"><label>Quantité</label><input id="st-br-qty" type="number" min="0" value="0" inputmode="numeric"></div>
        <div class="field"><label>Seuil alerte</label><input id="st-br-seuil" type="number" min="0" value="0" inputmode="numeric"></div>
      </div>
      <div class="field"><label>Conso N-1</label><input id="st-br-n1" type="number" min="0" value="0" inputmode="numeric"></div>
      <div class="slabel" style="margin:8px 0">SAULCET</div>
      <div class="field-row">
        <div class="field"><label>Quantité</label><input id="st-sa-qty" type="number" min="0" value="0" inputmode="numeric"></div>
        <div class="field"><label>Seuil alerte</label><input id="st-sa-seuil" type="number" min="0" value="0" inputmode="numeric"></div>
      </div>
      <div class="field"><label>Conso N-1</label><input id="st-sa-n1" type="number" min="0" value="0" inputmode="numeric"></div>
    </div>
    <div id="st-matos-wrap" style="display:none">
      <div class="slabel" style="margin-bottom:8px">BRANSAT</div>
      <div class="field-row">
        <div class="field"><label>Quantité</label><input id="st-br-mat-qty" type="number" min="0" value="0" inputmode="numeric"></div>
        <div class="field"><label>État</label><select id="st-br-etat"><option value="bon">Bon</option><option value="moyen">Moyen</option><option value="mauvais">Mauvais</option></select></div>
      </div>
      <div class="slabel" style="margin:8px 0">SAULCET</div>
      <div class="field-row">
        <div class="field"><label>Quantité</label><input id="st-sa-mat-qty" type="number" min="0" value="0" inputmode="numeric"></div>
        <div class="field"><label>État</label><select id="st-sa-etat"><option value="bon">Bon</option><option value="moyen">Moyen</option><option value="mauvais">Mauvais</option></select></div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="st-save-btn" onclick="saveStock()"><i class="ti ti-check"></i> Enregistrer</button>
    <button class="btn btn-ghost btn-block" onclick="closeSh('sh-stock')">Annuler</button>
  </div>
</div>

<!-- Mouvement stock -->
<div class="overlay" id="sh-mvt" onclick="closeSh('sh-mvt')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sh-handle"></div>
    <div class="sh-title" id="sh-mvt-title">Mouvement</div>
    <div class="field"><label>Local</label><select id="mvt-local"><option value="bransat">Bransat</option><option value="saulcet">Saulcet</option></select></div>
    <div class="field"><label>Type</label><select id="mvt-type"><option value="sortie">Sortie</option><option value="entree">Entrée</option></select></div>
    <div class="field"><label>Quantité</label>
      <div class="qty-input">
        <button class="qty-btn" onclick="qtyChange(-1)">−</button>
        <div class="qty-val" id="mvt-qty-val">1</div>
        <button class="qty-btn" onclick="qtyChange(1)">+</button>
      </div>
    </div>
    <div class="field"><label>Commentaire</label><input id="mvt-comment" type="text" placeholder="ex : Soirée Halloween"></div>
    <button class="btn btn-primary btn-block" onclick="saveMvt()"><i class="ti ti-check"></i> Confirmer</button>
    <button class="btn btn-ghost btn-block" onclick="closeSh('sh-mvt')">Annuler</button>
  </div>
</div>

<!-- Besoins événement -->
<div class="overlay" id="sh-besoins" onclick="closeSh('sh-besoins')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sh-handle"></div>

<script>
'use strict';

// ═══ CONSTANTES ══════════════════════════════════════════════
const COLORS = [
  {id:'violet',hex:'#5b52c4',bg:'#f0effe',mid:'#c5bff5'},
  {id:'teal',  hex:'#1a7d62',bg:'#e4f5ef',mid:'#7fd4b8'},
  {id:'coral', hex:'#c04a25',bg:'#fdeee9',mid:'#f4a58a'},
  {id:'amber', hex:'#a0620e',bg:'#fef3e2',mid:'#f5c46a'},
  {id:'pink',  hex:'#b03468',bg:'#fdeaf2',mid:'#f0a3c4'},
  {id:'blue',  hex:'#2070c0',bg:'#e8f2fd',mid:'#90c0f0'},
  {id:'sage',  hex:'#3a7d28',bg:'#eef5ea',mid:'#9ecf8a'},
  {id:'mauve', hex:'#7a3aac',bg:'#f4eef8',mid:'#c89de0'},
];
const PRIO_HEX = {haute:'#f08080',moyenne:'#f5c46a',basse:'#8ecf88'};
const colById  = id => COLORS.find(c=>c.id===id)||COLORS[0];

// ═══ ÉTAT GLOBAL ═════════════════════════════════════════════
let DB = null;
let curUser   = null;
let curEvId   = null;
let curItab   = 'tasks';
let curStab   = 'conso';
let curScreen = 'dash';
let manifests = {};
let tasks     = {};
let membres   = {};
let stocks    = {};
let mouvements= [];
let editEvId  = null;
let editTaskId= null;
let editStId  = null;
let mvtStId   = null;
let delCb     = null;
let selColor  = COLORS[0].id;
let clDraft   = [];
let mvtQty    = 1;
let calY, calM;
let unsubManif=null, unsubTasks=null, unsubMembres=null, unsubStocks=null, unsubMvt=null;
const today = new Date(); today.setHours(0,0,0,0);
calY = today.getFullYear(); calM = today.getMonth();

// ═══ LOGO ════════════════════════════════════════════════════
(function(){
  const src = 'data:image/png;base64,'+LOGO;
  document.getElementById('login-logo').src = src;
  document.getElementById('topbar-logo').src = src;
})();

// ═══ UTILS ═══════════════════════════════════════════════════
const asgn    = t => Array.isArray(t.assignees)?t.assignees:[];
const isFull  = t => asgn(t).length>=(t.spots||1);
const isMine  = t => !!curUser && asgn(t).includes(curUser.prenom);
const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtDate = s => s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'';
const fmtShort= s => s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';
const prioLbl = p => ({haute:'Haute',moyenne:'Moyenne',basse:'Basse'})[p]||'';
const cdDays  = d => d?Math.ceil((new Date(d+'T12:00:00')-Date.now())/86400000):null;
const cdLabel = n => n===null?'':n>0?`Dans ${n}j`:n===0?"Aujourd'hui":'Passé';
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2800);}
function openSh(id){document.getElementById(id).classList.add('on');}
function closeSh(id){document.getElementById(id).classList.remove('on');}

// ═══ CONNEXION ═══════════════════════════════════════════════
async function connexion() {
  const prenom = document.getElementById('inp-prenom').value.trim();
  const tel    = document.getElementById('inp-tel').value.trim();
  const btn    = document.getElementById('login-btn');
  const status = document.getElementById('login-status');

  if (!prenom) { showLoginErr('Prénom obligatoire'); return; }

  // Codes spéciaux — pas besoin de téléphone
  if (prenom.toLowerCase() === ADMIN_CODE) {
    curUser = {id:'admin_local',prenom:'Admin',telephone:'',role:'admin',statut:'valide'};
    lancerApp();
    return;
  }
  if (prenom.toLowerCase() === ORGA_CODE) {
    curUser = {id:'orga_local',prenom:'Organisateur',telephone:'',role:'organisateur',statut:'valide'};
    lancerApp();
    return;
  }

  if (!tel) { showLoginErr('Téléphone obligatoire'); return; }

  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Connexion…';
  status.style.display = 'none';

  try {
    // Attendre que Firebase soit prêt
    await attendreDB();

    const telNorm = tel.replace(/\s/g,'');
    const found = Object.values(membres).find(m =>
      m.prenom.toLowerCase() === prenom.toLowerCase() &&
      (m.telephone||'').replace(/\s/g,'') === telNorm
    );

    if (found) {
      // Membre connu
      if (found.role === 'attente') {
        status.className = 'attente';
        status.style.display = 'block';
        status.textContent = "Votre compte est en attente de validation par l'admin.";
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-login"></i> Accéder';
        return;
      }
      curUser = found;
      lancerApp();
    } else {
      // Vérifier homonyme
      const homonyme = Object.values(membres).find(m => m.prenom.toLowerCase() === prenom.toLowerCase());
      if (homonyme) {
        showLoginErr('Ce prénom existe déjà. Vérifiez votre numéro.');
        return;
      }
      // Nouveau membre
      const id = 'mb_'+Date.now();
      curUser = {id, prenom, telephone:tel, role:'attente', statut:'attente', createdAt:Date.now()};
      await DB.set('membres/'+id, curUser);
      // Notification WhatsApp
      const lien = window.location.href.split('?')[0];
      const msg = encodeURIComponent("Nouvelle inscription BSV\n\nPrénom : "+prenom+"\nTél : "+tel+"\n\nValider sur : "+lien);
      setTimeout(()=>window.open("https://wa.me/"+ADMIN_PHONE+"?text="+msg,'_blank'), 1200);
      status.className = 'attente';
      status.style.display = 'block';
      status.textContent = "Inscription envoyée ! En attente de validation.";
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-login"></i> Accéder';
    }
  } catch(e) {
    showLoginErr('Erreur : '+e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-login"></i> Accéder';
  }
}

function showLoginErr(msg) {
  const s = document.getElementById('login-status');
  s.className = 'erreur'; s.style.display = 'block'; s.textContent = msg;
}

function attendreDB() {
  return new Promise(resolve => {
    if (DB) { resolve(); return; }
    const t = setInterval(() => { if(DB){clearInterval(t);resolve();} }, 100);
    setTimeout(() => { clearInterval(t); resolve(); }, 5000); // timeout 5s
  });
}

// ═══ LANCER L'APP ════════════════════════════════════════════
function applyRole() {
  if(!curUser) return;
  const r = curUser.role;
  document.getElementById('user-nom').textContent = curUser.prenom;
  const rtag = document.getElementById('role-tag');
  rtag.textContent = {admin:'Admin',organisateur:'Orga',membre:'Membre',attente:'En attente'}[r]||r;
  rtag.className = 'role-tag '+(r==='admin'?'admin':r==='organisateur'?'orga':'membre');
  const iat = document.getElementById('itab-admin');
  if(iat) iat.style.display = r==='admin' ? '' : 'none';
  updateFab();
}

function lancerApp() {
  localStorage.setItem('bsv_user', JSON.stringify(curUser));

  // Masquer connexion, afficher app
  const login = document.getElementById('page-login');
  const app   = document.getElementById('page-app');
  login.classList.add('out');
  setTimeout(() => login.style.display='none', 350);
  app.classList.add('on');

  applyRole();

  // Listeners Firebase
  startListeners();

  // Afficher le bon écran selon rôle
  goTo('dash');
}

function deconnect() {
  document.getElementById('del-desc').textContent = 'Vous devrez ressaisir votre prénom et téléphone pour revenir.';
  document.querySelector('#sh-del .sh-title').textContent = 'Se déconnecter ?';
  document.getElementById('del-ok-btn').textContent = 'Se déconnecter';
  delCb = doDeconnect;
  openSh('sh-del');
}

function doDeconnect() {
  localStorage.removeItem('bsv_user');
  curUser = null;
  document.getElementById('page-app').classList.remove('on');
  document.getElementById('page-login').style.display = '';
  document.getElementById('page-login').classList.remove('out');
  document.getElementById('inp-prenom').value = '';
  document.getElementById('inp-tel').value = '';
  document.getElementById('login-status').style.display = 'none';
}

// ═══ FAB ═════════════════════════════════════════════════════
function showFab(visible) {
  const fab = document.getElementById('fab');
  fab.style.opacity       = visible ? '1' : '0';
  fab.style.pointerEvents = visible ? 'auto' : 'none';
}

function updateFab() {
  const isAdminOrOrga = curUser && (curUser.role==='admin'||curUser.role==='organisateur');
  const isAdmin       = curUser && curUser.role==='admin';
  const bar = document.getElementById('det-action-bar');
  const show =
    (curScreen==='dash'    && isAdminOrOrga) ||
    (curScreen==='events'  && isAdminOrOrga) ||
    (curScreen==='stocks'  && isAdmin)       ||
    (curScreen==='membres' && isAdmin);
  showFab(show);
  if(bar) bar.style.display = (curScreen==='detail' && isAdminOrOrga) ? 'flex' : 'none';
}

function onFab() {
  if(curScreen==='dash'||curScreen==='events') openNewEvent();
  if(curScreen==='stocks')  openNewStock();
  if(curScreen==='membres') openAddMembre();
}

// ═══ FIREBASE ════════════════════════════════════════════════
function initFirebase() {
  function loadScript(src, cb, errCb) {
    const s = document.createElement('script');
    s.src=src; s.async=true; s.onload=cb;
    s.onerror=errCb||function(){useFallback();};
    document.head.appendChild(s);
  }
  const cfg = window.FB_CFG;
  loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js', function() {
    loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js', function() {
      try {
        firebase.initializeApp(cfg);
        const fdb = firebase.firestore();
        DB = {
          listen: function(path,cb,errCb){ return fdb.collection(path).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),errCb||function(){}); },
          set:    function(path,data){ return fdb.doc(path).set(data); },
          update: function(path,data){ return fdb.doc(path).update(data); },
          delete: function(path){ return fdb.doc(path).delete(); },
          getAll: function(path){ return fdb.collection(path).get().then(s=>s.docs.map(d=>({id:d.id,...d.data()}))); }
        };
        document.getElementById('sync').className = 'ok';
        // Pré-charger les membres pour la connexion
        DB.listen('membres', items => {
          membres = {};
          items.forEach(d => { membres[d.id]=d; });
          updateBadgeMembres();
          // Mettre à jour curUser si membre normal
          if(curUser && curUser.id !== 'admin_local' && curUser.id !== 'orga_local') {
            const found = Object.values(membres).find(m=>m.id===curUser.id);
            if(found) { curUser=found; applyRole(); }
          }
          if(curScreen==='membres') renderMembres();
          renderDash();
        });
        // Si l'utilisateur est déjà connecté, (re)brancher les listeners maintenant
        if(curUser) startListeners();
      } catch(e) { useFallback(); }
    }, useFallback);
  }, useFallback);
}

function useFallback() {
  const store = ()=>JSON.parse(localStorage.getItem('bsv_data')||'{}');
  const save  = d=>localStorage.setItem('bsv_data',JSON.stringify(d));
  DB = {
    _cbs:{},
    listen(path,cb){this._cbs[path]=cb;this._fire(path,cb);return()=>{delete this._cbs[path];};},
    _fire(path,cb){const d=store();const parts=path.split('/');let n=d;for(const p of parts)n=n?.[p];cb(Object.entries(n||{}).map(([id,v])=>({id,...v})));},
    _fireAll(){Object.entries(this._cbs).forEach(([p,cb])=>this._fire(p,cb));},
    async set(path,data){const d=store();const parts=path.split('/');let n=d;for(let i=0;i<parts.length-1;i++){n[parts[i]]=n[parts[i]]||{};n=n[parts[i]];}n[parts[parts.length-1]]=data;save(d);this._fireAll();},
    async update(path,data){const d=store();const parts=path.split('/');let n=d;for(let i=0;i<parts.length-1;i++){n[parts[i]]=n[parts[i]]||{};n=n[parts[i]];}n[parts[parts.length-1]]={...(n[parts[parts.length-1]]||{}),...data};save(d);this._fireAll();},
    async delete(path){const d=store();const parts=path.split('/');let n=d;for(let i=0;i<parts.length-1;i++)n=n?.[parts[i]];if(n)delete n[parts[parts.length-1]];save(d);this._fireAll();},
    async getAll(path){const d=store();const parts=path.split('/');let n=d;for(const p of parts)n=n?.[p];return Object.entries(n||{}).map(([id,v])=>({id,...v}));}
  };
  // Charger les membres depuis le cache local pour la connexion
  membres = {};
  const cached = JSON.parse(localStorage.getItem('bsv_data')||'{}');
  Object.entries(cached.membres||{}).forEach(([id,v])=>{ membres[id]={id,...v}; });
  DB.listen('membres', items => {
    membres = {};
    items.forEach(d => { membres[d.id]=d; });
    updateBadgeMembres();
    if(curScreen==='membres') renderMembres();
  });
  if(curUser) startListeners();
}

function startListeners() {
  if(!DB) return;
  if(unsubManif)unsubManif();
  unsubManif = DB.listen('manifests', items=>{
    manifests={};
    items.forEach(d=>{manifests[d.id]=d;});
    renderDash(); renderEvents();
    if(curEvId) updateDetHeader();
  });
  if(unsubStocks)unsubStocks();
  unsubStocks = DB.listen('stocks', items=>{
    stocks={};
    items.forEach(d=>{stocks[d.id]=d;});
    if(curScreen==='stocks') renderStocks();
    renderDash();
  });
  if(unsubMvt)unsubMvt();
  unsubMvt = DB.listen('mouvements', items=>{
    mouvements=items.sort((a,b)=>(b.date||0)-(a.date||0));
    if(curScreen==='stocks'&&curStab==='mvt') renderMvt();
  });
}

// ═══ BOOT ════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', function() {
  initFirebase();
  // Restaurer session si disponible
  const saved = localStorage.getItem('bsv_user');
  if (saved) {
    try {
      curUser = JSON.parse(saved);
      lancerApp();
    } catch(e) {
      localStorage.removeItem('bsv_user');
    }
  }
  // Focus sur le champ prénom
  setTimeout(()=>document.getElementById('inp-prenom').focus(), 300);
});

document.getElementById('inp-prenom').addEventListener('keydown', e=>{if(e.key==='Enter')document.getElementById('inp-tel').focus();});
document.getElementById('inp-tel').addEventListener('keydown', e=>{if(e.key==='Enter')connexion();});

// ═══ NAVIGATION ══════════════════════════════════════════════
function goTo(s) {
  curScreen = s;
  document.querySelectorAll('.screen,.screen-flex').forEach(el=>{
    el.classList.remove('active'); el.style.display='';
  });
  document.querySelectorAll('.nitem').forEach(el=>el.classList.toggle('active',el.dataset.s===s));
  const el = document.getElementById('screen-'+s);
  if(el.classList.contains('screen-flex')){el.style.display='flex';el.classList.add('active');}
  else el.classList.add('active');
  updateFab();
  if(s==='dash')    renderDash();
  if(s==='events')  renderEvents();
  if(s==='stocks')  renderStocks();
  if(s==='membres') renderMembres();
}

// ═══ DASHBOARD ═══════════════════════════════════════════════
function renderDash() {
  const el = document.getElementById('dash-content');
  if(!el) return;
  const ids = Object.keys(manifests).sort((a,b)=>(manifests[a].date||'').localeCompare(manifests[b].date||''));
  const upcoming = ids.filter(id=>{ const d=cdDays(manifests[id].date); return d===null||d>=0; });
  let html = '';

  if(upcoming.length) {
    const id=upcoming[0], m=manifests[id], c=colById(m.color);
    const days=cdDays(m.date);
    html += '<div class="slabel">Prochain événement</div>';
    html += '<div class="dash-ev-card" onclick="selectEv(\''+id+'\')">';
    html += '<div class="dash-ev-banner" style="background:'+c.hex+'"></div>';
    html += '<div class="dash-ev-body">';
    html += '<div class="dash-ev-name">'+esc(m.name)+'</div>';
    html += '<div style="font-size:12px;color:var(--muted);display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap">';
    if(m.date) html += '<span>'+fmtDate(m.date)+'</span>';
    if(days!==null) html += '<span style="background:'+c.bg+';color:'+c.hex+';padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600">'+cdLabel(days)+'</span>';
    if(m.nbParticipants) html += '<span>'+m.nbParticipants+' participants</span>';
    html += '</div>';
    const tot=m.taskCount||0;
    html += '<div style="font-size:12px;color:var(--muted);margin-bottom:6px">'+tot+' tâche'+(tot>1?'s':'')+'</div>';
    html += '</div></div>';
  }

  // Stocks en alerte
  const alerts = Object.values(stocks).filter(s=>{
    if(s.type==='materiel') return false;
    const bOk=!s.bransat||s.bransat.quantite>=s.bransat.seuilAlerte;
    const sOk=!s.saulcet||s.saulcet.quantite>=s.saulcet.seuilAlerte;
    return !bOk||!sOk;
  });
  if(alerts.length) {
    html += '<div class="slabel" style="color:#c53030">Stocks en alerte ('+alerts.length+')</div>';
    alerts.forEach(s=>{
      const parts=[];
      if(s.bransat&&s.bransat.quantite<s.bransat.seuilAlerte) parts.push('Bransat: '+s.bransat.quantite);
      if(s.saulcet&&s.saulcet.quantite<s.saulcet.seuilAlerte) parts.push('Saulcet: '+s.saulcet.quantite);
      html += '<div class="dash-alert" onclick="goTo(\'stocks\')"><div class="dash-alert-dot" style="background:#ef4444"></div><div><div style="font-size:13px;font-weight:600">'+esc(s.nom)+'</div><div style="font-size:11px;color:#c53030">'+parts.join(' · ')+'</div></div></div>';
    });
  }

  // Membres en attente (admin)
  if(curUser?.role==='admin') {
    const att = Object.values(membres).filter(m=>m.role==='attente');
    if(att.length) {
      html += '<div class="slabel">Membres en attente ('+att.length+')</div>';
      att.forEach(m=>{
        html += '<div class="dash-alert" onclick="goTo(\'membres\')"><div class="dash-alert-dot" style="background:#f5c46a"></div><div><div style="font-size:13px;font-weight:600">'+esc(m.prenom)+'</div><div style="font-size:11px;color:#a0620e">'+m.telephone+'</div></div><i class="ti ti-chevron-right" style="color:var(--g3);margin-left:auto"></i></div>';
      });
    }
  }

  if(!html) html = '<div class="empty"><i class="ti ti-layout-dashboard"></i><h3>Bienvenue '+esc(curUser?.prenom||'')+'</h3><p>Créez votre premier événement !</p></div>';
  el.innerHTML = html;
}

// ═══ ÉVÉNEMENTS ══════════════════════════════════════════════
function renderEvents() {
  const el = document.getElementById('ev-list');
  if(!el) return;
  const ids = Object.keys(manifests).sort((a,b)=>(manifests[a].date||'').localeCompare(manifests[b].date||''));
  const isAdminOrOrga = curUser&&(curUser.role==='admin'||curUser.role==='organisateur');
  if(!ids.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-calendar-off"></i><h3>Aucun événement</h3><p>'+(isAdminOrOrga?'Appuyez sur + pour créer le premier.':'Aucun événement pour le moment.')+'</p></div>';
    return;
  }
  el.innerHTML = ids.map(id=>{
    const m=manifests[id],c=colById(m.color),days=cdDays(m.date);
    return '<div class="ev-card" onclick="selectEv(\''+id+'\')">'
      +'<div class="ev-strip" style="background:'+c.hex+'"></div>'
      +'<div class="ev-info"><div class="ev-name">'+esc(m.name)+'</div>'
      +'<div class="ev-meta">'+(m.date?'<span>'+fmtDate(m.date)+'</span>':'')+(days!==null?'<span class="cd-pill" style="background:'+c.bg+';color:'+c.hex+'">'+cdLabel(days)+'</span>':'')+'</div></div>'
      +'<span class="badge badge-gray">'+(m.taskCount||0)+' tâches</span>'
      +'<i class="ti ti-chevron-right" style="color:var(--g3)"></i></div>';
  }).join('');
}

// ═══ SELECT ÉVÉNEMENT ════════════════════════════════════════
function selectEv(id) {
  curEvId=id; tasks={};
  if(unsubTasks){unsubTasks();unsubTasks=null;}
  unsubTasks = DB.listen('manifests/'+id+'/tasks', items=>{
    tasks={};
    items.forEach(d=>{tasks[d.id]=d;});
    const cnt=Object.keys(tasks).length;
    if((manifests[id]?.taskCount||0)!==cnt) DB.update('manifests/'+id,{taskCount:cnt});
    renderItab(); renderDash();
  });
  goTo('detail');
  updateDetHeader();
  switchItab('tasks');
}

function updateDetHeader() {
  if(!curEvId||!manifests[curEvId]) return;
  const m=manifests[curEvId],c=colById(m.color);
  document.getElementById('det-name').textContent=m.name;
  const days=cdDays(m.date);
  document.getElementById('det-sub').textContent=m.date?(fmtDate(m.date)+(days!==null?' — '+cdLabel(days):'')):'';
  document.documentElement.style.setProperty('--ac',c.hex);
  document.documentElement.style.setProperty('--ac-bg',c.bg);

function renderTasks() {
  const ip=document.getElementById('ip-tasks');
  const all=Object.entries(tasks);
  const prioOrd={haute:0,moyenne:1,basse:2};
  all.sort(([,a],[,b])=>{const af=isFull(a),bf=isFull(b);if(af!==bf)return af?1:-1;return(prioOrd[a.prio]??2)-(prioOrd[b.prio]??2);});
  const c=colById(manifests[curEvId]?.color);
  const tot=all.reduce((s,[,t])=>s+(t.spots||1),0);
  const fil=all.reduce((s,[,t])=>s+Math.min(asgn(t).length,t.spots||1),0);
  const pct=tot?Math.round(fil/tot*100):0;
  const mine=all.filter(([,t])=>isMine(t)).length;
  ip.innerHTML='<div class="stats-row">'
    +'<div class="sbox"><div class="snum">'+all.length+'</div><div class="slbl-sm">Tâches</div></div>'
    +'<div class="sbox"><div class="snum" style="color:'+c.hex+'">'+mine+'</div><div class="slbl-sm">Mes tâches</div></div>'
    +'<div class="sbox"><div class="snum" style="color:#6ec97a">'+all.filter(([,t])=>isFull(t)).length+'</div><div class="slbl-sm">Complètes</div></div>'
    +'</div>'
    +'<div class="card" style="padding:13px 15px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px"><span>Avancement</span><strong style="color:'+c.hex+'">'+fil+'/'+tot+' — '+pct+'%</strong></div>'
    +'<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%;background:'+c.hex+'"></div></div></div>'
    +(!all.length?'<div class="empty"><i class="ti ti-clipboard-list"></i><p>Aucune tâche.</p></div>'
    :all.map(([id,t])=>tcardHTML(id,t)).join(''));
}

function tcardHTML(id,t) {
  const a=asgn(t),full=isFull(t),mine=isMine(t),spots=t.spots||1;
  const cl=Array.isArray(t.checklist)?t.checklist:[];
  const done=cl.filter(c=>c.checked).length;
  const cpct=cl.length?Math.round(done/cl.length*100):-1;
  const isAdminOrOrga=curUser&&(curUser.role==='admin'||curUser.role==='organisateur');
  const canAct=curUser&&(curUser.role==='membre'||isAdminOrOrga);
  const spots_html=Array.from({length:spots},(_,i)=>{
    const who=a[i]||'';
    const s=!who?'':who===curUser?.prenom?'mine-s':'filled';
    return '<span class="schip '+s+'">'+esc(who||'Libre')+'</span>';
  }).join('');
  let action='';
  if(!curUser||curUser.role==='attente') {
    action='<span style="font-size:11px;color:var(--muted)">Connectez-vous</span>';
  } else if(mine) {
    action='<button class="btn btn-danger btn-sm" data-id="'+id+'" onclick="event.stopPropagation();leaveTask(this.dataset.id)"><i class="ti ti-x"></i> Me désister</button>';
  } else if(!full&&canAct) {
    action='<button class="btn btn-success btn-sm" data-id="'+id+'" onclick="event.stopPropagation();joinTask(this.dataset.id)"><i class="ti ti-check"></i> Prendre</button>';
  } else if(full) {
    action='<span style="font-size:12px;color:#2e7d32;font-weight:600"><i class="ti ti-circle-check"></i> Complet</span>';
  }
  const adm=isAdminOrOrga
    ?'<button class="btn-icon btn-xs" data-id="'+id+'" onclick="event.stopPropagation();openEditTask(this.dataset.id)" style="margin-left:auto"><i class="ti ti-edit"></i></button>'
    +'<button class="btn-icon btn-xs" data-id="'+id+'" style="background:#fde8e8;color:#c53030;border-color:#f5c6c6" onclick="event.stopPropagation();confirmDelTask(this.dataset.id)"><i class="ti ti-trash"></i></button>'
    :'';
  return '<div class="tcard '+(mine?'mine':'')+(full&&!mine?' full-card':'')+'" data-id="'+id+'" onclick="openTaskDetail(this.dataset.id)">'
    +'<div style="display:flex;align-items:flex-start;gap:8px"><span class="tc-name">'+esc(t.title)+'</span><span class="ppill '+t.prio+'">'+prioLbl(t.prio)+'</span></div>'
    +(t.desc?'<div style="font-size:12px;color:var(--muted);line-height:1.5">'+esc(t.desc)+'</div>':'')
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--g4);font-weight:500">'
    +'<span><i class="ti ti-users" style="font-size:13px"></i>'+a.length+'/'+spots+'</span>'
    +(t.deadline?'<span><i class="ti ti-calendar" style="font-size:13px"></i>'+fmtShort(t.deadline)+'</span>':'')
    +(cpct>=0?'<span><i class="ti ti-checkbox" style="font-size:13px"></i>'+done+'/'+cl.length+'</span>':'')
    +'</div>'
    +(cpct>=0?'<div class="prog-sm"><div class="prog-sm-fill" style="width:'+cpct+'%"></div></div>':'')
    +'<div style="display:flex;gap:5px;flex-wrap:wrap">'+spots_html+'</div>'
    +'<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'+action+adm+'</div>'
    +'</div>';
}


async function joinTask(id){if(!curUser||curUser.role==='attente')return;const t=tasks[id];if(!t||isFull(t)||isMine(t))return;await DB.update('manifests/'+curEvId+'/tasks/'+id,{assignees:[...asgn(t),curUser.prenom]});toast('Tâche prise !');}

function renderCal(){
  const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('cal-label').textContent=months[calM]+' '+calY;
  const byDate={};
  Object.entries(tasks).forEach(([id,t])=>{if(t.deadline){if(!byDate[t.deadline])byDate[t.deadline]=[];byDate[t.deadline].push({id,...t});}});
  const first=new Date(calY,calM,1),dow=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate(),dip=new Date(calY,calM,0).getDate();
  const todayStr=today.toISOString().slice(0,10);
  const c=colById(manifests[curEvId]?.color);
  let html=['L','M','M','J','V','S','D'].map(d=>'<div class="cdh">'+d+'</div>').join('');
  for(let i=0;i<dow;i++) html+='<div class="cday other"><div class="cnum">'+(dip-dow+1+i)+'</div></div>';
  for(let d=1;d<=dim;d++){
    const ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dt=byDate[ds]||[];
    html+='<div class="cday'+(ds===todayStr?' today':'')+'"><div class="cnum">'+d+'</div>'+dt.slice(0,2).map(t=>'<div class="cchip" style="background:'+c.hex+'18;color:'+c.hex+'" onclick="event.stopPropagation();openTaskDetail(\''+t.id+'\')">'+esc(t.title)+'</div>').join('')+(dt.length>2?'<div style="font-size:9px;color:var(--g4)">+' +(dt.length-2)+'</div>':'')+'</div>';
  }
  const rem=(7-((dow+dim)%7))%7;
  for(let i=1;i<=rem;i++) html+='<div class="cday other"><div class="cnum">'+i+'</div></div>';
  document.getElementById('cgrid').innerHTML=html;
}
function calPrev(){if(calM===0){calM=11;calY--;}else calM--;renderCal();}
function calNext(){if(calM===11){calM=0;calY++;}else calM++;renderCal();}

// ═══ PLANNING ════════════════════════════════════════════════
function renderRetro(){
  const ip=document.getElementById('ip-retro');
  const m=manifests[curEvId];
  if(!m?.date){ip.innerHTML='<div class="empty"><i class="ti ti-calendar-off"></i><p>Ajoutez une date pour voir le planning.</p></div>';return;}
  const evDate=new Date(m.date+'T00:00:00');evDate.setHours(0,0,0,0);
  const c=colById(m.color);
  const getMonday=d=>{const dt=new Date(d);const day=dt.getDay();dt.setDate(dt.getDate()-day+(day===0?-6:1));return dt;};
  const weeks=new Map();
  let cur=new Date(today);
  while(cur<=evDate){const mon=getMonday(cur);const key=mon.toISOString().slice(0,10);if(!weeks.has(key))weeks.set(key,{items:[]});cur.setDate(cur.getDate()+7);}
  const evMon=getMonday(evDate).toISOString().slice(0,10);
  if(!weeks.has(evMon))weeks.set(evMon,{items:[]});
  Object.entries(tasks).forEach(([id,t])=>{if(!t.deadline)return;const dl=new Date(t.deadline+'T12:00:00');let best=null;for(const k of weeks.keys()){if(new Date(k+'T00:00:00')<=dl)best=k;}if(best)weeks.get(best).items.push({id,...t});});
  const nowMon=getMonday(today).toISOString().slice(0,10);
  ip.innerHTML='<div style="display:flex;flex-direction:column;gap:8px">'+[...weeks.entries()].sort().map(([key,{items}])=>{
    const isEv=key===evMon,isNow=key===nowMon;
    const label=isEv?'SEMAINE J — '+fmtShort(m.date).toUpperCase():'SEMAINE DU '+new Date(key+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'}).toUpperCase();
    return '<div class="rweek"><div class="rweek-h '+(isEv?'ev':'')+'">'+label+(isEv?'<span style="margin-left:auto;color:'+c.hex+'">JOUR J</span>':'')+'</div><div class="rweek-body">'+(items.map(t=>'<div class="rchip" onclick="openTaskDetail(\''+t.id+'\')"><span class="rdot" style="background:'+(PRIO_HEX[t.prio]||'#ccc')+'"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px">'+esc(t.title)+'</span><span style="font-size:11px;color:var(--g4)">'+asgn(t).length+'/'+(t.spots||1)+'</span></div>').join('')||'<span style="font-size:12px;color:var(--g4)">Aucune tâche</span>')+'</div></div>';
  }).join('')+'</div>';
}

function confirmDelTask(id){resetDelSheet();document.getElementById('del-desc').textContent='Supprimer "'+tasks[id]?.title+'" ?';delCb=async()=>{await DB.delete('manifests/'+curEvId+'/tasks/'+id);toast('Tâche supprimée');};openSh('sh-del');}

// ═══ STOCKS ══════════════════════════════════════════════════
function switchStab(t){curStab=t;document.querySelectorAll('.stab').forEach(b=>b.classList.toggle('on',b.dataset.st===t));renderStocks();}
function renderStocks(){if(curStab==='conso')renderConso();if(curStab==='matos')renderMatos();if(curStab==='mvt')renderMvt();}
function renderConso(){
  const el=document.getElementById('stock-body');
  const items=Object.values(stocks).filter(s=>s.type!=='materiel');
  const isAdmin=curUser?.role==='admin';
  if(!items.length){el.innerHTML='<div class="empty"><i class="ti ti-bottle"></i><h3>Aucun article</h3><p>'+(isAdmin?'Appuyez sur + pour ajouter.':'Aucun stock renseigné.')+'</p></div>';return;}
  const cats={};items.forEach(s=>{const c=s.categorie||'autre';cats[c]=cats[c]||[];cats[c].push(s);});
  const catLabels={boissons:'🧃 Boissons',nourriture:'🍕 Nourriture',packaging:'📦 Packaging',autre:'📋 Autre'};
  el.innerHTML=Object.entries(cats).map(([cat,arts])=>'<div class="slabel">'+( catLabels[cat]||cat)+'</div>'+arts.map(s=>{
    const bA=s.bransat&&s.bransat.seuilAlerte>0&&s.bransat.quantite<s.bransat.seuilAlerte;
    const sA=s.saulcet&&s.saulcet.seuilAlerte>0&&s.saulcet.quantite<s.saulcet.seuilAlerte;
    return '<div class="stock-card"><div class="stock-card-header"><span class="stock-card-name">'+esc(s.nom)+'</span>'+(bA||sA?'<span class="badge badge-red">⚠ Alerte</span>':'')+'<span style="font-size:11px;color:var(--g4)">'+( s.unite||'')+'</span>'+(isAdmin?'<button class="btn-icon btn-xs" onclick="openEditStock(\''+s.id+'\')"><i class="ti ti-edit"></i></button>':'')+'</div>'
    +'<div class="stock-card-body">'
    +(s.bransat?'<div class="local-row"><span class="local-tag">Bransat</span><span class="local-qty'+(bA?' local-alert':'')+'">'+s.bransat.quantite+' '+(s.unite||'')+'</span>'+(bA?'<span class="local-alert">↓'+s.bransat.seuilAlerte+'</span>':'')+'<button class="btn btn-ghost btn-xs" onclick="openMvt(\''+s.id+'\',\'bransat\')"><i class="ti ti-arrows-exchange"></i></button></div>':'')
    +(s.saulcet?'<div class="local-row"><span class="local-tag saulcet">Saulcet</span><span class="local-qty'+(sA?' local-alert':'')+'">'+s.saulcet.quantite+' '+(s.unite||'')+'</span>'+(sA?'<span class="local-alert">↓'+s.saulcet.seuilAlerte+'</span>':'')+'<button class="btn btn-ghost btn-xs" onclick="openMvt(\''+s.id+'\',\'saulcet\')"><i class="ti ti-arrows-exchange"></i></button></div>':'')
    +(curEvId&&manifests[curEvId]?'<button class="btn btn-warn btn-xs" style="margin-top:4px" onclick="showBesoins(\''+s.id+'\')"><i class="ti ti-calculator"></i> Besoins pour '+esc(manifests[curEvId].name)+'</button>':'')
    +'</div></div>';
  }).join('')).join('');
}
function renderMatos(){
  const el=document.getElementById('stock-body');
  const items=Object.values(stocks).filter(s=>s.type==='materiel');
  const isAdmin=curUser?.role==='admin';
  if(!items.length){el.innerHTML='<div class="empty"><i class="ti ti-tools"></i><h3>Aucun matériel</h3><p>'+(isAdmin?'Appuyez sur + pour ajouter.':'Aucun matériel.')+'</p></div>';return;}
  el.innerHTML=items.map(s=>'<div class="stock-card"><div class="stock-card-header"><span class="stock-card-name">'+esc(s.nom)+'</span>'+(isAdmin?'<button class="btn-icon btn-xs" onclick="openEditStock(\''+s.id+'\')"><i class="ti ti-edit"></i></button>':'')+'</div><div class="stock-card-body">'
    +(s.bransat?'<div class="local-row"><span class="local-tag">Bransat</span><span class="local-qty">'+s.bransat.quantite+'</span><span class="mat-etat '+( s.bransat.etat||'bon')+'">'+ ({bon:'✓ Bon',moyen:'~ Moyen',mauvais:'✗ Mauvais'}[s.bransat.etat||'bon'])+'</span><button class="btn btn-ghost btn-xs" onclick="openMvt(\''+s.id+'\',\'bransat\')"><i class="ti ti-arrows-exchange"></i></button></div>':'')
    +(s.saulcet?'<div class="local-row"><span class="local-tag saulcet">Saulcet</span><span class="local-qty">'+s.saulcet.quantite+'</span><span class="mat-etat '+(s.saulcet.etat||'bon')+'">'+ ({bon:'✓ Bon',moyen:'~ Moyen',mauvais:'✗ Mauvais'}[s.saulcet.etat||'bon'])+'</span><button class="btn btn-ghost btn-xs" onclick="openMvt(\''+s.id+'\',\'saulcet\')"><i class="ti ti-arrows-exchange"></i></button></div>':'')
    +'</div></div>').join('');
}
function renderMvt(){
  const el=document.getElementById('stock-body');
  if(!mouvements.length){el.innerHTML='<div class="empty"><i class="ti ti-history"></i><h3>Aucun mouvement</h3></div>';return;}
  el.innerHTML=mouvements.slice(0,50).map(m=>{
    const s=stocks[m.stockId],isE=m.type==='entree';
    return '<div class="card-sm" style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:32px;border-radius:50%;background:'+(isE?'#e8f5e9':'#fde8e8')+';display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-arrow-'+(isE?'up':'down')+'" style="color:'+(isE?'#2e7d32':'#c53030')+';font-size:16px"></i></div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">'+(s?esc(s.nom):'?')+'</div><div style="font-size:11px;color:var(--muted)">'+(m.local==='bransat'?'Bransat':'Saulcet')+' · '+(m.membre||'?')+(m.comment?' · '+esc(m.comment):'')+'</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:14px;font-weight:700;color:'+(isE?'#2e7d32':'#c53030')+'">'+(isE?'+':'-')+m.quantite+'</div><div style="font-size:10px;color:var(--g4)">'+(m.date?new Date(m.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'')+'</div></div></div>';
  }).join('');
}
function openNewStock(){editStId=null;document.getElementById('sh-stock-title').textContent='Nouvel article';['st-name','st-unit'].forEach(id=>document.getElementById(id).value='');document.getElementById('st-cat').value='boissons';['st-br-qty','st-br-seuil','st-br-n1','st-sa-qty','st-sa-seuil','st-sa-n1'].forEach(id=>document.getElementById(id).value=0);updateStockForm();openSh('sh-stock');}
function openEditStock(id){const s=stocks[id];if(!s)return;editStId=id;document.getElementById('sh-stock-title').textContent="Modifier l'article";document.getElementById('st-name').value=s.nom||'';document.getElementById('st-unit').value=s.unite||'';document.getElementById('st-cat').value=s.categorie||'boissons';const isMat=s.type==='materiel';if(!isMat){document.getElementById('st-br-qty').value=s.bransat?.quantite||0;document.getElementById('st-br-seuil').value=s.bransat?.seuilAlerte||0;document.getElementById('st-br-n1').value=s.bransat?.consoN1||0;document.getElementById('st-sa-qty').value=s.saulcet?.quantite||0;document.getElementById('st-sa-seuil').value=s.saulcet?.seuilAlerte||0;document.getElementById('st-sa-n1').value=s.saulcet?.consoN1||0;}else{document.getElementById('st-br-mat-qty').value=s.bransat?.quantite||0;document.getElementById('st-br-etat').value=s.bransat?.etat||'bon';document.getElementById('st-sa-mat-qty').value=s.saulcet?.quantite||0;document.getElementById('st-sa-etat').value=s.saulcet?.etat||'bon';}updateStockForm();openSh('sh-stock');}
function updateStockForm(){const isMat=document.getElementById('st-cat').value==='materiel';document.getElementById('st-conso-wrap').style.display=isMat?'none':'';document.getElementById('st-matos-wrap').style.display=isMat?'':'none';}
async function saveStock(){
  const nom=document.getElementById('st-name').value.trim();
  if(!nom){toast('Nom obligatoire');return;}
  const btn=document.getElementById('st-save-btn');btn.disabled=true;
  try{
    const cat=document.getElementById('st-cat').value,isMat=cat==='materiel';
    const data={nom,categorie:cat,unite:document.getElementById('st-unit').value.trim(),type:isMat?'materiel':'consommable'};
    if(!isMat){data.bransat={quantite:parseInt(document.getElementById('st-br-qty').value)||0,seuilAlerte:parseInt(document.getElementById('st-br-seuil').value)||0,consoN1:parseInt(document.getElementById('st-br-n1').value)||0};data.saulcet={quantite:parseInt(document.getElementById('st-sa-qty').value)||0,seuilAlerte:parseInt(document.getElementById('st-sa-seuil').value)||0,consoN1:parseInt(document.getElementById('st-sa-n1').value)||0};}
    else{data.bransat={quantite:parseInt(document.getElementById('st-br-mat-qty').value)||0,etat:document.getElementById('st-br-etat').value};data.saulcet={quantite:parseInt(document.getElementById('st-sa-mat-qty').value)||0,etat:document.getElementById('st-sa-etat').value};}
    const id=editStId||'st_'+Date.now();
    await DB.set('stocks/'+id,{...((editStId?stocks[editStId]:{})),id,...data});
    toast(editStId?'Article modifié':'Article ajouté');closeSh('sh-stock');
  }catch(e){toast('Erreur : '+e.message);}
  finally{btn.disabled=false;}
}
function openMvt(stId,local){mvtStId=stId;mvtQty=1;const s=stocks[stId];document.getElementById('sh-mvt-title').textContent='Mouvement — '+(s?esc(s.nom):'?');document.getElementById('mvt-local').value=local;document.getElementById('mvt-type').value='sortie';document.getElementById('mvt-qty-val').textContent='1';document.getElementById('mvt-comment').value='';openSh('sh-mvt');}
function qtyChange(d){mvtQty=Math.max(1,mvtQty+d);document.getElementById('mvt-qty-val').textContent=mvtQty;}
async function saveMvt(){
  if(!mvtStId)return;
  try{
    const local=document.getElementById('mvt-local').value,type=document.getElementById('mvt-type').value;
    const s=stocks[mvtStId];if(!s){toast('Article introuvable');return;}
    const ld=s[local]||{},newQty=(ld.quantite||0)+(type==='entree'?mvtQty:-mvtQty);
    await DB.update('stocks/'+mvtStId,{[local]:{...ld,quantite:Math.max(0,newQty)}});
    await DB.set('mouvements/mvt_'+Date.now(),{stockId:mvtStId,local,type,quantite:mvtQty,membre:curUser?.prenom||'?',comment:document.getElementById('mvt-comment').value.trim(),date:Date.now(),evenementId:curEvId||null});
    toast(type==='sortie'?'Sortie enregistrée':'Entrée enregistrée');closeSh('sh-mvt');
  }catch(e){toast('Erreur : '+e.message);}
}
function showBesoins(stId){
  if(!curEvId){toast('Sélectionnez un événement');return;}
  const s=stocks[stId],m=manifests[curEvId];if(!s||!m)return;
  const nbPart=m.nbParticipants||50;
  const calc=local=>{const d=s[local];if(!d)return null;const n1=d.consoN1||0;const ref=m.nbParticipantsN1||0;const besoin=n1>0?(ref>0?Math.ceil(n1*(nbPart/ref)):n1):0;const manque=Math.max(0,besoin-(d.quantite||0));return{besoin,actuel:d.quantite||0,manque};};
  const br=calc('bransat'),sa=calc('saulcet');
  document.getElementById('sh-besoins-title').textContent=esc(s.nom)+' — '+esc(m.name);
  document.getElementById('besoins-content').innerHTML='<div style="background:var(--g0);border-radius:10px;padding:12px;font-size:13px;color:var(--muted);line-height:1.6">'+(m.nbParticipantsN1?('Conso N-1 rapportée à '+nbPart+' participants (contre '+m.nbParticipantsN1+' l\'an dernier).'):('Basé sur la conso N-1 brute. Renseignez les participants N-1 de l\'événement pour un calcul proportionnel.'))+'</div>'
    +(br?'<div class="card-sm"><div style="font-size:12px;font-weight:700;color:#2070c0;margin-bottom:8px">BRANSAT</div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>Stock actuel</span><strong>'+br.actuel+' '+(s.unite||'')+'</strong></div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>Besoin estimé</span><strong>'+br.besoin+' '+(s.unite||'')+'</strong></div><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:'+(br.manque>0?'#c53030':'#2e7d32')+'"><span>À commander</span><span>'+(br.manque>0?'+'+br.manque:'✓ OK')+' '+(s.unite||'')+'</span></div></div>':'')
    +(sa?'<div class="card-sm"><div style="font-size:12px;font-weight:700;color:#5b52c4;margin-bottom:8px">SAULCET</div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>Stock actuel</span><strong>'+sa.actuel+' '+(s.unite||'')+'</strong></div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>Besoin estimé</span><strong>'+sa.besoin+' '+(s.unite||'')+'</strong></div><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:'+(sa.manque>0?'#c53030':'#2e7d32')+'"><span>À commander</span><span>'+(sa.manque>0?'+'+sa.manque:'✓ OK')+' '+(s.unite||'')+'</span></div></div>':'');
  openSh('sh-besoins');
}

// ═══ MEMBRES ═════════════════════════════════════════════════
function updateBadgeMembres(){
  const att=Object.values(membres).filter(m=>m.role==='attente').length;
  const badge=document.getElementById('badge-membres');
  badge.style.display=att&&curUser?.role==='admin'?'':'none';
  badge.textContent=att;
}
function renderMembres(){
  const el=document.getElementById('membres-content');if(!el)return;
  const isAdmin=curUser?.role==='admin';
  const all=Object.values(membres);
  if(!all.length){el.innerHTML='<div class="empty"><i class="ti ti-users"></i><h3>Aucun membre</h3></div>';return;}
  const roleOrder={admin:0,organisateur:1,membre:2,attente:3};
  all.sort((a,b)=>(roleOrder[a.role]??9)-(roleOrder[b.role]??9)||(a.prenom||'').localeCompare(b.prenom||''));
  const roleLabels={admin:'Admin',organisateur:'Organisateur',membre:'Membre',attente:'En attente'};
  const roleBadge={admin:'badge-red',organisateur:'badge-blue',membre:'badge-green',attente:'badge-amber'};
  el.innerHTML='<div class="slabel">Membres ('+all.length+')</div>'+all.map(m=>'<div class="membre-card"><div class="membre-avatar">'+(m.prenom||'?')[0].toUpperCase()+'</div><div class="membre-info"><div class="membre-name">'+esc(m.prenom||'?')+(m.id===curUser?.id?' <span style="font-size:11px;color:var(--g4)">(moi)</span>':'')+'</div><div class="membre-phone">'+(m.telephone||'Pas de téléphone')+'</div></div><span class="badge '+(roleBadge[m.role]||'badge-gray')+'">'+( roleLabels[m.role]||m.role)+'</span>'+(isAdmin&&m.role!=='admin'?'<div style="display:flex;gap:6px">'+(m.role==='attente'?'<button class="btn-icon btn-xs" style="background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7" onclick="validerMembre(\''+m.id+'\')" title="Valider"><i class="ti ti-check"></i></button>':'')+'<button class="btn-icon btn-xs" onclick="changerRole(\''+m.id+'\')" title="Changer rôle"><i class="ti ti-edit"></i></button><button class="btn-icon btn-xs" style="background:#fde8e8;color:#c53030;border-color:#f5c6c6" onclick="supprimerMembre(\''+m.id+'\')" title="Supprimer"><i class="ti ti-trash"></i></button></div>':'')+'</div>').join('');
}
function openAddMembre(){toast('Les membres peuvent rejoindre via le lien de connexion.');}
async function validerMembre(id){await DB.update('membres/'+id,{role:'membre',statut:'valide'});toast('Membre validé');}
async function changerRole(id){const m=membres[id];if(!m)return;const roles=['membre','organisateur','attente'];const next=roles[(roles.indexOf(m.role)+1)%roles.length];await DB.update('membres/'+id,{role:next});toast('Rôle : '+next);}
async function supprimerMembre(id){resetDelSheet();document.getElementById('del-desc').textContent='Supprimer "'+membres[id]?.prenom+'" ?';delCb=async()=>{await DB.delete('membres/'+id);toast('Membre supprimé');};openSh('sh-del');}

function resetDelSheet(){
  document.querySelector('#sh-del .sh-title').textContent = 'Supprimer ?';
  document.getElementById('del-ok-btn').textContent = 'Supprimer définitivement';
}

// ═══ SUPPRESSION GÉNÉRIQUE ═══════════════════════════════════
document.getElementById('del-ok-btn').onclick=async()=>{if(delCb){await delCb();delCb=null;}closeSh('sh-del');};

  pickCol,calPrev,calNext,
  switchStab,openNewStock,openEditStock,saveStock,updateStockForm,
  openMvt,qtyChange,saveMvt,showBesoins,
  validerMembre,changerRole,supprimerMembre,openAddMembre,
});
