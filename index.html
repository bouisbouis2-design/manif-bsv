<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test BSV</title>
<style>
body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f9f8f6; }
#status { font-size: 18px; font-weight: bold; color: #2e7d32; margin-bottom: 20px; }
#log { font-size: 13px; color: #666; text-align: center; line-height: 2; }
</style>
</head>
<body>
<div id="status">Chargement…</div>
<div id="log"></div>

<script>
function log(msg) {
  document.getElementById('log').innerHTML += msg + '<br>';
}
document.getElementById('status').textContent = 'JS fonctionne !';
log('1. Script de base OK');

window.addEventListener('load', function() {
  log('2. Page chargée OK');
});

document.addEventListener('DOMContentLoaded', function() {
  log('3. DOM prêt OK');
});

log('4. Fin du script');
</script>
</body>
</html>
